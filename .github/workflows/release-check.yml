name: Release check

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current Cargo.toml version to crates.io
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  check:
    needs: validation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_REF" != "refs/tags/v$version" ]]; then
            echo "error: expected tag v$version for Cargo.toml" >&2
            exit 1
          fi
      - run: cargo publish --dry-run --locked
      - run: cargo build --release --locked
      - name: Package Linux binary
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          archive="paintrs-$version-linux-x86_64.tar.gz"
          tar -czf "$archive" -C target/release paintrs -C "$GITHUB_WORKSPACE" README.md assets/Liberation-LICENSE.txt
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: paintrs-linux-x86_64
          path: |
            paintrs-*-linux-x86_64.tar.gz
            paintrs-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: check
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
