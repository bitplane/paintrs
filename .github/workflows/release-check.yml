name: Release check

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current Cargo.toml version to crates.io
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  check:
    needs: validation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_REF" != "refs/tags/v$version" ]]; then
            echo "error: expected tag v$version for Cargo.toml" >&2
            exit 1
          fi
      - run: cargo publish --dry-run --locked

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux-x86_64
            binary: target/release/paintrs
          - runner: windows-2025
            platform: windows-x86_64
            binary: target/release/paintrs.exe
          - runner: macos-15
            platform: macos-aarch64
            binary: target/release/paintrs
          - runner: macos-15-intel
            platform: macos-x86_64
            binary: target/release/paintrs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: cargo build --release --locked
      - name: Package desktop binary
        run: python scripts/package-desktop.py ${{ matrix.platform }} --binary ${{ matrix.binary }}
      - uses: actions/upload-artifact@v6
        with:
          name: paintrs-${{ matrix.platform }}
          path: |
            target/dist/paintrs-*
          if-no-files-found: error

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: bundle
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
